name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate APK fixtures
        run: python tools/make_fixtures.py

      - name: Build Veyra and installer
        shell: bash
        run: ./build.sh

      - name: Headless self-test
        shell: bash
        run: ./Veyra.exe --selftest build/fixtures/veyra-fixture.apk --out build/selftest.json

      - name: Verify installer payload
        shell: bash
        run: |
          if [ ! -d runtime ]; then
            echo "runtime/ is not committed, so this build produces a bootstrap-only installer;"
            echo "skipping payload checks. Attach a full VeyraSetup.exe to a GitHub Release."
            exit 0
          fi
          ./VeyraSetup.exe --check --check-out build/installer-check.json
          ./VeyraSetup.exe --extract build/installer-test
          cmp Veyra.exe build/installer-test/Veyra.exe
          ./build/installer-test/Veyra.exe --selftest build/fixtures/veyra-fixture.apk --out build/installer-test/selftest.json

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: veyra-windows
          path: |
            Veyra.exe
            VeyraSetup.exe
